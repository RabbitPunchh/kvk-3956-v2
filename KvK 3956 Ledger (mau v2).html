<style>
/* Layout: wide war-room table on a night-navy ground — header, headline figures, kingdom totals, then the governor table
   (each metric cell = value + a thin bar in that metric's colour); a side drawer holds one governor's detail and charts.
   Single dark look by choice (asked: less bright), so colours are set once on :root. */
:root {
  color-scheme: dark;
  --bg: #0c111c;
  --surface: #141b2b;
  --surface-2: #1b2438;
  --ink: #e6ebf3;
  --muted: #8d99ad;
  --line: #26314a;
  --track: #222c42;
  /* metric colours (as requested) */
  --c-power: #9d7bff;   /* Power: tím */
  --c-kp: #2fd38c;      /* Kill points: xanh lá */
  --c-dead: #f5a524;    /* Deads: cam vàng */
  --c-t5: #f8d538;      /* T5: vàng */
  --c-t4: #c67bf5;      /* T4: tím */
  --c-t3: #4f9bff;      /* T3: xanh dương */
  --c-t2: #7be36a;      /* T2: xanh lá */
  --c-t1: #f2f4f8;      /* T1: trắng */
  --c-kpd: #8f9bff;     /* KPD */
  --up: #2fd38c; --up-bg: rgba(47, 211, 140, .14);
  --down: #ff6b6b; --down-bg: rgba(255, 107, 107, .14);
  --warn: #f5a524;
  --accent: #6aa6ff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1720px; margin: 0 auto; padding-inline: clamp(16px, 2.4vw, 40px); padding-block: 26px 56px; display: grid; gap: 26px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.02; text-transform: uppercase; letter-spacing: .02em; }
h2 { font-size: 21px; text-transform: uppercase; letter-spacing: .04em; }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header.top { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); position: relative; }
header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
  background: linear-gradient(90deg, var(--c-power), var(--c-t3), var(--c-kp), var(--c-t5), var(--c-dead)); }
header.top p { margin: 0; max-width: 92ch; color: var(--muted); }
.stamp { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.stamp b { color: var(--ink); font-weight: 600; }
.formula { display: grid; gap: 4px; font: 600 17px var(--f-data); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; background: var(--surface); width: fit-content; max-width: 100%; }
.formula .k { color: var(--muted); }

/* headline figures */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; border-top: 3px solid var(--tc, var(--line)); }
.tile .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 700 30px/1.05 var(--f-display); color: var(--tc, var(--ink)); }
.tile .s { font-size: 12px; color: var(--muted); }
@media (max-width: 1000px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

section { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
thead th { background: var(--surface-2); font: 600 11px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; z-index: 1; }
tbody tr:last-child td { border-bottom: 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--mc, var(--muted)); }
.up { color: var(--up); } .down { color: var(--down); } .zero { color: var(--muted); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font: 600 12.5px var(--f-data); font-variant-numeric: tabular-nums; }
.pill.up { background: var(--up-bg); } .pill.down { background: var(--down-bg); } .pill.zero { background: transparent; }

/* governor table */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools input, .tools select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; }
.tools input { flex: 1 1 320px; min-width: 0; }
.tools input:focus, .tools select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gov { max-height: 74vh; }
.gov td.l, .gov th.l { text-align: left; }
.gov th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.gov th[aria-sort] button::after { content: "↕"; opacity: .35; font-size: 10px; }
.gov th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--accent); }
.gov th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--accent); }
.gov th .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--mc); margin-right: 2px; }
.gov tbody tr:hover td { background: var(--surface-2); }
.gov td.m { padding-bottom: 6px; }
.cellbar { display: grid; justify-items: end; gap: 4px; }
.cellbar i { display: block; width: 72px; height: 3px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; }
.cellbar i b { position: absolute; inset: 0 auto 0 0; background: var(--mc); border-radius: 2px; }
.link { all: unset; cursor: pointer; color: var(--ink); border-bottom: 1px dashed var(--muted); }
.link:hover { color: var(--accent); border-color: var(--accent); }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { max-width: 210px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 3px; background: var(--surface-2); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
.rank { color: var(--muted); font-family: var(--f-data); }
.prog { display: grid; justify-items: end; gap: 4px; min-width: 96px; }
.prog i { display: block; width: 96px; height: 5px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; }
.prog i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.ok { color: var(--up); } .mid { color: var(--warn); } .low { color: var(--down); }
.bg-ok { background: var(--up); } .bg-mid { background: var(--warn); } .bg-low { background: var(--down); }
.res { display: inline-block; padding: 2px 8px; border-radius: 4px; font: 600 12px var(--f-body); white-space: nowrap; }
.res-kp { background: var(--up-bg); color: var(--up); } .res-kpd { background: rgba(143, 155, 255, .16); color: var(--c-kpd); } .res-fail { background: var(--down-bg); color: var(--down); }
.prog.dim { opacity: .45; }
.kprow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* detail drawer */
dialog { padding: 0; border: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(680px, 100%); max-width: 100%; background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); }
dialog::backdrop { background: rgba(3, 6, 12, .62); }
.drawer { display: grid; gap: 18px; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(28px + env(safe-area-inset-bottom, 0px)); }
.dh { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.dh h2 { font-size: 30px; text-transform: none; letter-spacing: 0; word-break: break-word; }
.dh .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.ctrl { display: flex; gap: 6px; }
.ctrl button, .copy { font: 600 12px var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; cursor: pointer; }
.ctrl button:hover, .copy:hover { border-color: var(--accent); color: var(--accent); }
.ctrl button:disabled { opacity: .4; cursor: default; }
.ranks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ranks div { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; border-top: 2px solid var(--mc, var(--line)); }
.ranks b { font: 700 22px/1 var(--f-display); }
.ranks span { font-size: 11px; color: var(--muted); }
.chart { display: grid; gap: 6px; }
.chart h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg text { font-family: var(--f-data); font-size: 11px; }
.renamed { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 4px; padding: 8px 10px; font-size: 13px; }
.kpbox { display: grid; gap: 6px; background: var(--surface-2); border-radius: 6px; padding: 10px 12px; }
.kpbox .big { font: 700 26px/1 var(--f-display); }
.kpbox i { display: block; height: 8px; min-width: 0; border-radius: 4px; background: var(--track); position: relative; overflow: hidden; }
.kpbox i b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
@media (max-width: 560px) { .ranks { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dh h2 { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { dialog[open] { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

  const cls = (n) => n > 0 ? "up" : n < 0 ? "down" : "zero";
  const pct = (d, a) => (d == null || !a) ? "—" : (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d / a * 100).toFixed(1) + "%";
  function compact(n) {
    const a = Math.abs(n), s = n < 0 ? "−" : "";
    if (a >= 1e9) return s + (a / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "B";
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
    if (a >= 1e3) return s + (a / 1e3).toFixed(0) + "K";

  }
  const sc = (n) => n == null ? "—" : (n > 0 ? "+" : "") + compact(n);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const level = (p) => p == null ? "" : p >= 100 ? "ok" : p >= 50 ? "mid" : "low";

  // ---------------------------------------------------------------- data
  const G = GOV.map((r) => {
    const g = { id: r[0], nameStart: r[1], nameEnd: r[2], s: r[3], e: r[4], dkpReport: r[5] };
    g.name = g.nameEnd || g.nameStart;
    g.renamed = !!(g.nameStart && g.nameEnd && g.nameStart !== g.nameEnd);
    g.status = g.s && g.e ? "both" : g.s ? "start" : "end";
    g.d = g.s && g.e ? g.e.map((v, i) => v - g.s[i]) : null;
    g.powStart = g.s ? g.s[0] : null;
    g.kpd = g.d ? 10 * g.d[2] + 5 * g.d[7] + 15 * g.d[8] : null;
    g.kpCheck = g.powStart != null ? KP_FACTOR * g.powStart : null;
    g.kpPct = g.d && g.kpCheck ? g.d[3] / g.kpCheck * 100 : null;
    g.kpdPct = g.kpd != null && g.kpCheck ? g.kpd / g.kpCheck * 100 : null;
    g.result = g.kpPct == null ? null : g.kpPct >= 100 ? "kp" : "fail";          // chỉ dựa vào KP; KPD % để tham khảo
    return g;
  });
  const N = G.length;
  const sum = (fn) => G.reduce((a, g) => a + (fn(g) || 0), 0);
  const T = M.map((m, i) => ({ ...m, s: sum((g) => g.s && g.s[i]), e: sum((g) => g.e && g.e[i]) }));
  const kpdTot = sum((g) => g.kpd), checkTot = sum((g) => g.kpCheck);
  const metKp = G.filter((g) => g.result === "kp").length, notMet = G.filter((g) => g.result === "fail").length;
  const RES = { kp: ["Met", "res-kp", 1], fail: ["Not met", "res-fail", 0] };
  const renamedN = G.filter((g) => g.renamed).length;
  function rankBy(fn) { const l = G.filter((g) => fn(g) != null).sort((a, b) => fn(b) - fn(a)); const r = new Map(); l.forEach((g, i) => r.set(g.id, i + 1)); return { r, n: l.length }; }
  const RK = { kpd: rankBy((g) => g.kpd), kp: rankBy((g) => g.d && g.d[3]), deads: rankBy((g) => g.d && g.d[2]), kpPct: rankBy((g) => g.kpPct), kpdPct: rankBy((g) => g.kpdPct),
    t4: rankBy((g) => g.d && g.d[7]), t5: rankBy((g) => g.d && g.d[8]), power: rankBy((g) => g.e && g.e[0]) };

  // ---------------------------------------------------------------- header + totals
  $("#eyebrow").textContent = `KvK ${META.kvk} · ${META.camp ? META.camp + " camp" : ""} · Kingdom ${META.kingdom}`;
  $("#stamp").innerHTML = `<span>Start <b class="num">${esc(META.start)}</b></span><span>End <b class="num">${esc(META.end)}</b></span><span><b class="num">${N}</b> governors</span>`;
  const tile = (k, v, s, c) => `<div class="tile" style="--tc:${c}"><span class="k">${k}</span><span class="v num">${v}</span><span class="s">${s}</span></div>`;
  $("#tiles").innerHTML =
    tile("Kill points gained", sc(T[3].e - T[3].s), `${compact(T[3].s)} → ${compact(T[3].e)}`, "var(--c-kp)") +

    tile("KPD total", compact(kpdTot), `10×Deads + 5×T4 + 15×T5`, "var(--c-kpd)") +
    tile("KP Requirement met", `${metKp} / ${N}`, `${notMet} not met · kingdom KP ${Math.round((T[3].e - T[3].s) / checkTot * 100)}% of ${compact(checkTot)}`, "var(--c-t5)") +
    tile("Power change", sc(T[0].e - T[0].s), `${compact(T[0].s)} → ${compact(T[0].e)}`, "var(--c-power)");

    T.map((t) => `<tr><td><span class="dot" style="--mc:${t.c}"></span>${t.n}</td><td class="num">${fmt(t.s)}</td><td class="num">${fmt(t.e)}</td><td class="num"><span class="pill ${cls(t.e - t.s)}">${sgn(t.e - t.s)}</span></td><td class="num ${cls(t.e - t.s)}">${pct(t.e - t.s, t.s)}</td></tr>`).join("") +
    `<tr><td><span class="dot" style="--mc:var(--c-kpd)"></span>KPD (this KvK)</td><td class="num zero">—</td><td class="num">${fmt(kpdTot)}</td><td class="num zero">—</td><td class="num zero">—</td></tr>` +
    `<tr><td><span class="dot" style="--mc:var(--c-t5)"></span>KP Requirement (3 × Power at start)</td><td class="num">${fmt(checkTot)}</td><td class="num zero">—</td><td class="num zero">—</td><td class="num zero">—</td></tr></tbody>`;

  // ---------------------------------------------------------------- governor table
  const COLS = [
    { k: "rank", t: "#", l: true },
    { k: "id", t: "Governor ID", l: true, sort: (g) => g.id },

    { k: "kpd", t: "KPD", c: "var(--c-kpd)", sort: (g) => g.kpd, v: (g) => g.kpd, plain: true },

    { k: "result", t: "Result", sort: (g) => g.result ? RES[g.result][2] * 1e6 + (g.kpPct || 0) : null }
  ];
  const colMax = {};
  COLS.forEach((c) => { if (c.v) colMax[c.k] = Math.max(1, ...G.map((g) => Math.max(0, c.v(g) || 0))); });
  let sortKey = "kpd", sortDir = -1, query = "", kpf = "all";
  try { const s = JSON.parse(localStorage.getItem("kvk3956.v2.sort") || "null"); if (s && COLS.some((c) => c.k === s.k && c.sort)) { sortKey = s.k; sortDir = s.d; } } catch (e) {}
  $("#sortSel").innerHTML = COLS.filter((c) => c.sort).map((c) => `<option value="${c.k}">Sort: ${c.t}</option>`).join("");
  const NUMSORT = (x) => x == null ? -Infinity : x;
  function view() {

  }
  function cell(c, g) {
    const v = c.v(g);

  }

    return `<td><span class="prog${dim ? " dim" : ""}"><span class="num ${lv}">${p == null ? "—" : p.toFixed(0) + "%"}</span><i><b class="bg-${lv}" style="width:${p == null ? 0 : Math.min(100, p)}%"></b></i></span></td>`;
  }

    let h = "<thead><tr>" + COLS.map((c) => {
      const s = c.sort ? (c.k === sortKey ? (sortDir < 0 ? "descending" : "ascending") : "none") : null;
      const lab = (c.c ? `<span class="sw" style="--mc:${c.c}"></span>` : "") + c.t;
      return `<th class="${c.l ? "l" : ""}"${s ? ` aria-sort="${s}"` : ""}>${c.sort ? `<button type="button" data-sort="${c.k}">${lab}</button>` : lab}</th>`;
    }).join("") + "</tr></thead><tbody>";
    if (!list.length) h += `<tr><td colspan="${COLS.length}" class="empty">No governor matches this search / filter.</td></tr>`;

      const p = g.kpPct, lv = level(p);
      h += `<tr><td class="l rank">${i + 1}</td>` +
        `<td class="l"><button type="button" class="link num" data-id="${g.id}">${g.id}</button></td>` +

        `<td>${g.result ? `<span class="res ${RES[g.result][1]}">${RES[g.result][0]}</span>` : "—"}</td></tr>`;

  }
  $("#govTable").addEventListener("click", (e) => {

  $("#q").addEventListener("input", (e) => { query = e.target.value; render(); });
  function save() { try { localStorage.setItem("kvk3956.v2.sort", JSON.stringify({ k: sortKey, d: sortDir })); } catch (e) {} }

  // ---------------------------------------------------------------- SVG charts (one scale per chart)
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  function hbars(groups, opts) {
    // groups: [{label, bars:[{v, color, opacity, name}]}]
    const W = 600, L = opts.labelW || 70, R = 80, rowH = 14, gap = 3, groupGap = 12, top = 22;
    const max = opts.max || niceMax(Math.max(1, ...groups.flatMap((g) => g.bars.map((b) => b.v || 0))));
    const nb = Math.max(...groups.map((g) => g.bars.length));
    const H = top + groups.length * (nb * (rowH + gap) + groupGap) + 4;
    const x = (v) => L + (W - L - R) * Math.max(0, v) / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.title)}">`;
    for (let k = 0; k <= 4; k++) {

        `<text x="${xx}" y="${top - 10}" text-anchor="middle" fill="var(--muted)">${opts.tick ? opts.tick(v) : compact(v)}</text>`;

      const gh = g.bars.length * (rowH + gap) - gap;
      s += `<text x="${L - 8}" y="${y + gh / 2 + 4}" text-anchor="end" fill="var(--ink)">${esc(g.label)}</text>`;
      g.bars.forEach((b) => {
        const v = b.v || 0, w = Math.max(v > 0 ? 1 : 0, x(v) - L), lab = b.label != null ? b.label : compact(v);
        s += `<rect x="${L}" y="${y}" width="${w}" height="${rowH}" rx="2" fill="${b.color}" fill-opacity="${b.opacity || 1}"><title>${esc(b.name)}: ${esc(lab)}</title></rect>` +
          `<text x="${L + w + 6}" y="${y + rowH - 3}" fill="var(--muted)">${esc(lab)}</text>`;
        y += rowH + gap;
      });
      y += groupGap - gap;
    });
    return s + "</svg>";
  }

  // ---------------------------------------------------------------- detail drawer
  const dlg = $("#dlg");
  function openDetail(id) {
    const g = G.find((x) => x.id === id); if (!g) return;
    const list = view(), at = list.findIndex((x) => x.id === id);
    const prev = at > 0 ? list[at - 1].id : null, next = at >= 0 && at < list.length - 1 ? list[at + 1].id : null;
    const rk = (k) => RK[k].r.get(id);
    const rows = M.map((m, i) => {
      const a = g.s ? g.s[i] : null, b = g.e ? g.e[i] : null, d = g.d ? g.d[i] : null;
      return `<tr><td><span class="dot" style="--mc:${m.c}"></span>${m.n}</td><td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td><td class="num"><span class="pill ${cls(d)}">${sgn(d)}</span></td><td class="num ${cls(d)}">${pct(d, a)}</td></tr>`;
    }).join("") +
      `<tr><td><span class="dot" style="--mc:var(--c-kpd)"></span>KPD (this KvK)</td><td class="num zero">—</td><td class="num">${fmt(g.kpd)}</td><td class="num zero">—</td><td class="num zero">—</td></tr>`;
    const lv = level(g.kpPct);
    const tierC = ["var(--c-t1)", "var(--c-t2)", "var(--c-t3)", "var(--c-t4)", "var(--c-t5)"];
    const tiers = ["T1", "T2", "T3", "T4", "T5"].map((t, k) => ({ label: t + " kills", bars: [
      { v: g.s ? g.s[4 + k] : 0, color: tierC[k], opacity: .38, name: "Start" }, { v: g.e ? g.e[4 + k] : 0, color: tierC[k], opacity: 1, name: "End" }] }));
    const kpdParts = g.d ? [
      { label: "10 × Deads", bars: [{ v: 10 * g.d[2], color: "var(--c-dead)", name: "10 × Deads gained" }] },
      { label: "5 × T4", bars: [{ v: 5 * g.d[7], color: "var(--c-t4)", name: "5 × T4 kills gained" }] },
      { label: "15 × T5", bars: [{ v: 15 * g.d[8], color: "var(--c-t5)", name: "15 × T5 kills gained" }] }] : [];
    const pctile = (k) => { const r = rk(k), n = RK[k].n; return r ? Math.round((n - r) / Math.max(1, n - 1) * 100) : 0; };
    const stand = [["KPD", "kpd", "var(--c-kpd)"], ["KP %", "kpPct", "var(--c-t5)"], ["KPD % (ref.)", "kpdPct", "var(--c-kpd)"], ["Δ Kill points", "kp", "var(--c-kp)"], ["Δ Deads", "deads", "var(--c-dead)"],
      ["Δ T4 kills", "t4", "var(--c-t4)"], ["Δ T5 kills", "t5", "var(--c-t5)"], ["Power (end)", "power", "var(--c-power)"]]
      .map(([l, k, c]) => ({ label: l, bars: [{ v: pctile(k), color: c, name: "Percentile", label: rk(k) ? "#" + rk(k) : "—" }] }));
    $("#drawer").innerHTML =
      `<div class="dh"><h2 id="dName">${esc(g.name)}</h2>
        <div class="ctrl"><button type="button" id="dPrev"${prev ? "" : " disabled"} aria-label="Previous governor">‹</button><button type="button" id="dNext"${next ? "" : " disabled"} aria-label="Next governor">›</button><button type="button" id="dClose">Close</button></div>
        <div class="meta"><span>Governor ID <b class="num" id="dId">${g.id}</b></span><button type="button" class="copy" id="dCopy">Copy ID</button><span>${g.status === "both" ? "In start and end snapshots" : g.status === "start" ? "Start snapshot only" : "End snapshot only"}</span></div></div>` +
      (g.renamed ? `<div class="renamed">Renamed during KvK: <b>${esc(g.nameStart)}</b> → <b>${esc(g.nameEnd)}</b></div>` : "") +

        <span class="muted" style="font-size:12px">Result is based on KP, if no met, check KPD.</span></div>` +
      `<div class="ranks"><div style="--mc:var(--c-kpd)"><b class="num">#${rk("kpd") || "—"}</b><span>KPD rank of ${RK.kpd.n}</span></div><div style="--mc:var(--c-kp)"><b class="num">#${rk("kp") || "—"}</b><span>Kill-point gain rank</span></div><div style="--mc:var(--c-dead)"><b class="num">#${rk("deads") || "—"}</b><span>Deads gain rank</span></div><div style="--mc:var(--c-t5)"><b class="num">#${rk("kpPct") || "—"}</b><span>KP % rank</span></div><div style="--mc:var(--c-kpd)"><b class="num">#${rk("kpdPct") || "—"}</b><span>KPD % rank (ref.)</span></div></div>` +
      `<div class="scroll"><table><thead><tr><th>Metric</th><th>Start</th><th>End</th><th>Change</th><th>%</th></tr></thead><tbody>${rows}</tbody></table></div>` +
      (kpdParts.length ? `<div class="chart"><h3>KPD breakdown · ${fmt(g.kpd)}</h3>` + hbars(kpdParts, { title: "KPD breakdown", labelW: 84 }) + `</div>` : "") +
      `<div class="chart"><h3>Kills by troop tier</h3><div class="legend"><span><i style="background:var(--muted);opacity:.45"></i>Start (faded)</span><span><i style="background:var(--ink)"></i>End (full colour)</span></div>` +

      `<div class="chart"><h3>Standing in kingdom ${META.kingdom}</h3><span class="muted" style="font-size:12px">Percentile among the ${N} governors (100 = top); the label shows the rank.</span>` +

  $("#foot").textContent = `Source: ${META.source}, sheet K${META.kingdom} (KvK statistics powered by Hero Scrolls). Change = end − start. KPD is calculated here from the gains and matches the report's DKP column for all ${N} governors.`;
  render();
  const h = (location.hash || "").slice(1);
  if (/^\d+$/.test(h)) openDetail(+h);
})();
</script>
